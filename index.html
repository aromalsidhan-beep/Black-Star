
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>Black Star Shopping</title>
<style>
*{box-sizing:border-box}
:root{--gold:#d4af37;--bg:#090909;--panel:#171717;--muted:#bbb}
body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}
header{text-align:center;padding:24px 12px;background:#000;border-bottom:1px solid #514217}
.logo{font-size:30px;font-weight:900;letter-spacing:2px;color:var(--gold)}
header p{color:#ccc;margin:8px 0 0}
main{max-width:1100px;margin:auto;padding:16px}
h2{color:var(--gold);margin-top:28px}
input{width:100%;padding:13px;margin:7px 0;background:#111;color:white;border:1px solid #514217;border-radius:8px;font-size:16px}
button{padding:11px 13px;border:0;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer}
.gold{background:var(--gold);color:#111}
.secondary{background:#292929;color:#fff;border:1px solid #68551e}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{min-width:0;background:var(--panel);border:1px solid #443819;border-radius:12px;padding:10px}
.card img{width:100%;height:150px;object-fit:cover;border-radius:8px;background:#222}
.card h3{font-size:15px;min-height:36px}
.price{color:var(--gold);font-size:19px;font-weight:bold}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.actions button{flex:1;min-width:65px}
.item{padding:12px 0;border-bottom:1px solid #333}
.notice{padding:12px;margin:12px 0;border-radius:8px;background:#29230f;color:#f2d879;overflow-wrap:anywhere}
.muted{color:var(--muted);font-size:14px}
footer{text-align:center;color:#999;padding:28px 10px}
@media(min-width:650px){.products{grid-template-columns:repeat(4,minmax(0,1fr))}.card img{height:190px}}
</style>
</head>
<body>
<header>
  <div class="logo">★ BLACK STAR</div>
  <p>Premium Shopping · Quality You Can Trust</p>
</header>

<main>
  <div id="status" class="notice">Connecting to Black Star database…</div>
  <input id="search" type="search" placeholder="Search products…" aria-label="Search products">

  <h2>Featured Products</h2>
  <div id="products" class="products"></div>

  <h2>My Wishlist ♥</h2>
  <div id="wishlist"></div>

  <h2>Your Shopping Cart</h2>
  <div id="cart"></div>
  <h3 id="total" class="price">Total: ₹0</h3>

  <h2>Demo Checkout</h2>
  <p class="muted">Demo only. This does not create a real order or take payment.</p>
  <input id="customerName" placeholder="Your name" autocomplete="name">
  <input id="customerPhone" placeholder="Phone number" type="tel" autocomplete="tel">
  <input id="customerAddress" placeholder="Delivery address" autocomplete="street-address">
  <button class="gold" id="checkout">Place Demo Order</button>
  <div id="checkoutMessage" class="notice" hidden></div>
</main>

<footer>© 2026 Black Star Shopping</footer>

<script>
"use strict";

const SUPABASE_URL = "https://wwgtthnfntskeqkmnrtf.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_YZ5cdU4un39XsnZpzWfYlg_XOf-2Vn_";

const fallbackProducts = [
 {id:"headphones",name:"Wireless Headphones",price:999,image_url:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80"},
 {id:"watch",name:"Smart Watch",price:1499,image_url:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80"},
 {id:"shoes",name:"Sports Shoes",price:1199,image_url:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80"},
 {id:"backpack",name:"Travel Backpack",price:799,image_url:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=600&q=80"}
];

let products = fallbackProducts;
let cart = readStorage("blackStarCart", {});
let wishlist = readStorage("blackStarWishlist", []);

function readStorage(key, fallback) {
  try {
    const value = JSON.parse(localStorage.getItem(key));
    return value ?? fallback;
  } catch {
    return fallback;
  }
}

const money = n => "₹" + Number(n).toLocaleString("en-IN",{maximumFractionDigits:2});

function safe(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[ch]);
}

function save() {
  localStorage.setItem("blackStarCart", JSON.stringify(cart));
  localStorage.setItem("blackStarWishlist", JSON.stringify(wishlist));
}

function productImage(product) {
  return product.image_url ||
    fallbackProducts.find(item => item.name === product.name)?.image_url || "";
}

function renderProducts() {
  const term = document.getElementById("search").value.trim().toLowerCase();
  const shown = products.filter(p => p.name.toLowerCase().includes(term));

  document.getElementById("products").innerHTML = shown.map(p => `
    <article class="card">
      <img src="${safe(productImage(p))}" alt="${safe(p.name)}" loading="lazy">
      <h3>${safe(p.name)}</h3>
      <div class="price">${money(p.price)}</div>
      <div class="actions">
        <button class="gold" data-add="${safe(p.id)}">Add to Cart</button>
        <button class="secondary" data-wish="${safe(p.id)}">
          ${wishlist.includes(String(p.id)) ? "♥ Saved" : "♡ Wishlist"}
        </button>
      </div>
    </article>
  `).join("") || "<p>No products found.</p>";
}

function renderCart() {
  let total = 0;
  let count = 0;
  let html = "";

  for (const [id, quantity] of Object.entries(cart)) {
    const product = products.find(p => String(p.id) === id);
    if (!product || quantity < 1) continue;

    total += Number(product.price) * quantity;
    count += quantity;

    html += `
      <div class="item">
        <strong>${safe(product.name)}</strong><br>
        ${money(product.price)} × ${quantity}
        <div class="actions">
          <button class="secondary" data-minus="${safe(id)}">−</button>
          <button class="secondary" data-plus="${safe(id)}">+</button>
          <button class="secondary" data-remove="${safe(id)}">Remove</button>
        </div>
      </div>`;
  }

  document.getElementById("cart").innerHTML =
    html || '<p class="muted">Your cart is empty.</p>';
  document.getElementById("total").textContent =
    `Total (${count} items): ${money(total)}`;
}

function renderWishlist() {
  const savedProducts = products.filter(p => wishlist.includes(String(p.id)));

  document.getElementById("wishlist").innerHTML = savedProducts.map(p => `
    <div class="item">
      ${safe(p.name)} — ${money(p.price)}
      <button class="secondary" data-wish="${safe(p.id)}">Remove</button>
      <button class="gold" data-add="${safe(p.id)}">Add to Cart</button>
    </div>
  `).join("") || '<p class="muted">Your wishlist is empty.</p>';
}

function render() {
  renderProducts();
  renderCart();
  renderWishlist();
}

document.addEventListener("click", event => {
  const button = event.target.closest("button");
  if (!button) return;

  if (button.dataset.add !== undefined) {
    const id = String(button.dataset.add);
    cart[id] = (Number(cart[id]) || 0) + 1;
    save();
    renderCart();
    document.getElementById("status").textContent = "✓ Added to cart!";
  }

  if (button.dataset.plus !== undefined) {
    const id = button.dataset.plus;
    cart[id] = (Number(cart[id]) || 0) + 1;
    save();
    renderCart();
  }

  if (button.dataset.minus !== undefined) {
    const id = button.dataset.minus;
    cart[id] = (Number(cart[id]) || 0) - 1;
    if (cart[id] <= 0) delete cart[id];
    save();
    renderCart();
  }

  if (button.dataset.remove !== undefined) {
    delete cart[button.dataset.remove];
    save();
    renderCart();
  }

  if (button.dataset.wish !== undefined) {
    const id = String(button.dataset.wish);
    wishlist = wishlist.includes(id)
      ? wishlist.filter(item => item !== id)
      : [...wishlist, id];
    save();
    render();
  }
});

document.getElementById("search").addEventListener("input", renderProducts);

async function loadProducts() {
  try {
    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/products?select=id,name,description,price,image_url,category,stock&active=eq.true&order=id`,
      {
        headers: {
          "apikey": SUPABASE_PUBLISHABLE_KEY,
          "Authorization": "Bearer " + SUPABASE_PUBLISHABLE_KEY
        }
      }
    );

    if (!response.ok) {
      throw new Error("Supabase HTTP " + response.status);
    }

    const data = await response.json();
    if (!Array.isArray(data)) throw new Error("Invalid product response");

    products = data.map(p => ({
      ...p,
      id: String(p.id),
      price: Number(p.price)
    }));

    document.getElementById("status").textContent =
      "✓ Products loaded from your Black Star database.";
  } catch (error) {
    products = fallbackProducts;
    document.getElementById("status").textContent =
      "Database connection failed. Showing sample products. Check Supabase API access and product-table permissions.";
    console.error("Product loading error:", error);
  }

  render();
}

document.getElementById("checkout").addEventListener("click", () => {
  const message = document.getElementById("checkoutMessage");
  const name = document.getElementById("customerName").value.trim();
  const phone = document.getElementById("customerPhone").value.trim();
  const address = document.getElementById("customerAddress").value.trim();

  message.hidden = false;

  if (!Object.keys(cart).length) {
    message.textContent = "Your cart is empty.";
    return;
  }

  if (!name || !phone || !address) {
    message.textContent = "Enter your name, phone number, and delivery address to preview demo checkout.";
    return;
  }

  message.textContent =
    "Demo checkout only. No order was saved and no payment was taken.";
});

render();
loadProducts();
</script>
</body>
</html>
